<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#0E2448 0%,#0B1D3A 60%,#081630 100%)}
.panel{position:absolute;left:0;top:0;bottom:0;width:420px;overflow:hidden;background:#091832}
.panel svg{position:absolute;inset:0}
.panel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,24,50,0) 40%,#0B1D3A 100%)}
.medal{position:absolute;left:150px;top:205px;width:220px;height:220px;display:flex;align-items:center;justify-content:center;z-index:2}
.medal svg{position:absolute;inset:0}
.txt{position:absolute;right:70px;top:54px;width:640px;height:522px;display:flex;flex-direction:column;justify-content:space-between}
.k{font-family:Messiri;font-weight:700;font-size:100px;line-height:1.05;color:#E7C76A}
.k span{display:block}
.k span:nth-child(2){color:#F3DFA2}
.k span:nth-child(3){color:#FFFFFF}
.sub{font-weight:600;font-size:30px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between}
.price{font-weight:700;font-size:25px;color:rgba(255,255,255,.7)}
.price b{color:#E7C76A;font-weight:800}
</style></head><body>
<div class="bg"></div>
<div class="panel">
  <svg width="420" height="630"><defs><pattern id="p" width="84" height="84" patternUnits="userSpaceOnUse"><g fill="none" stroke="#C9A227" stroke-opacity=".42" stroke-width="1.3"><rect x="23" y="23" width="38" height="38"/><rect x="23" y="23" width="38" height="38" transform="rotate(45 42 42)"/><path d="M0 0 L23 23 M84 0 L61 23 M0 84 L23 61 M84 84 L61 61 M42 0 L42 15 M42 84 L42 69 M0 42 L15 42 M84 42 L69 42"/></g></pattern></defs><rect width="420" height="630" fill="url(#p)"/></svg>
</div>
<div class="medal">
  <svg viewBox="0 0 220 220"><g transform="translate(110 110)"><rect x="-74" y="-74" width="148" height="148" rx="10" fill="#0B1D3A" stroke="#C9A227" stroke-width="3"/><rect x="-74" y="-74" width="148" height="148" rx="10" fill="#0B1D3A" stroke="#C9A227" stroke-width="3" transform="rotate(45)"/><rect x="-64" y="-64" width="128" height="128" rx="8" fill="#0B1D3A" stroke="none"/></g></svg>
  <svg viewBox="0 0 24 24" width="84" height="84" fill="#C9A227" style="position:relative;inset:auto"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3z"/></svg>
</div>
<div class="txt">
  <div>
    <div class="k"><span>واجبك</span><span>بحثك</span><span>رسالتك</span></div>
    <div class="sub">مع خبير في تخصصك يشرح ويراجع معك عبر واتساب</div>
  </div>
  <div class="row">
    <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="#C9A227"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3z"/></svg><div class="dot"></div></div><div class="word"><b>FIZ</b>BS</div></div>
    <div class="price">من <b>100 ريال</b> لكل 1,000 كلمة</div>
  </div>
</div>
</body></html>
