<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 688" width="800" height="688" role="img" aria-labelledby="t d"><title id="t">Dissertation findings chapter structure</title><desc id="d">The usual order of a dissertation findings chapter: introduction, sample or participants, data preparation, main findings by research question or theme, additional findings and summary.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="687" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Dissertation findings chapter structure</text><g transform="translate(0,-22)"><line x1="70.0" y1="151.5" x2="70.0" y2="616.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><rect x="110.0" y="112.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="144.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Introduction</text><text x="130.0" y="170.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Restate the aims and explain how the chapter is organised</text><rect x="110.0" y="205.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="237.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Sample or participants</text><text x="130.0" y="263.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Response rate, demographics or a participant table</text><rect x="110.0" y="298.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="330.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Data preparation</text><text x="130.0" y="356.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Cleaning, missing data and reliability checks</text><rect x="110.0" y="391.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="423.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Main findings</text><text x="130.0" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Results by research question or by theme</text><rect x="110.0" y="484.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="516.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Additional findings</text><text x="130.0" y="542.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Other or unexpected results worth reporting</text><rect x="110.0" y="577.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="609.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Summary</text><text x="130.0" y="635.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">The key results in brief, leading into the discussion</text><circle cx="70" cy="151.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="158.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">1</text><circle cx="70" cy="244.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="251.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">2</text><circle cx="70" cy="337.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="344.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">3</text><circle cx="70" cy="430.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="437.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">4</text><circle cx="70" cy="523.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="530.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">5</text><circle cx="70" cy="616.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="623.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">6</text></g><text x="772.0" y="670.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>