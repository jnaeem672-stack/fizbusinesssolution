<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 668" width="800" height="668" role="img" aria-labelledby="t d"><title id="t">Narrowing a topic into a research question</title><desc id="d">Funnel diagram narrowing social media marketing to influencer marketing and young consumers, then to influencer credibility among Generation Z sustainable fashion consumers in the UK, ending in a focused research question.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="667" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Narrowing a topic into a research question</text><g transform="translate(0,-22)"><path d="M50.0,116 H750.0 L700.0,186 H100.0 Z" fill="#FBF6E6" stroke="#FFFFFF" stroke-width="2"/><text x="400.0" y="144.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A6700" text-anchor="middle">Broad area</text><text x="400.0" y="166.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">Social media marketing</text><path d="M100.0,188 H700.0 L650.0,258 H150.0 Z" fill="#F5EACB" stroke="#FFFFFF" stroke-width="2"/><text x="400.0" y="216.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A6700" text-anchor="middle">Narrower focus</text><text x="400.0" y="238.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">Influencer marketing and young consumers</text><path d="M150.0,260 H650.0 L605.0,350 H195.0 Z" fill="#EBD596" stroke="#FFFFFF" stroke-width="2"/><text x="400.0" y="288.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A6700" text-anchor="middle">Concept, population and setting</text><text x="400.0" y="310.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">Influencer credibility, Generation Z, sustainable</text><text x="400.0" y="330.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">fashion brands, UK</text><path d="M195.0,352 H605.0 L565.0,442 H235.0 Z" fill="#DDBE5B" stroke="#FFFFFF" stroke-width="2"/><text x="400.0" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="middle">Relationship</text><text x="400.0" y="402.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">The effect of credibility on purchase</text><text x="400.0" y="422.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B1D3A" text-anchor="middle">intention</text><line x1="400.0" y1="450.0" x2="400.0" y2="480.0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="90.0" y="486.0" width="620.0" height="126.0" rx="16" fill="#0B1D3A"/><text x="400.0" y="516.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#C9A227" text-anchor="middle">Research question</text><text x="400.0" y="542.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">How does perceived influencer credibility influence purchase</text><text x="400.0" y="566.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">intention among Generation Z consumers of sustainable fashion</text><text x="400.0" y="590.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">brands in the UK?</text><text x="400.0" y="644.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="middle">Then test it against the FINER criteria and refine it with your supervisor.</text></g><text x="772.0" y="650.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>