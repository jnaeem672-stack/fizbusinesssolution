<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 655" width="800" height="655" role="img" aria-labelledby="t d"><title id="t">Primary vs secondary research</title><desc id="d">Comparison table: primary research is collected by you for your own question through questionnaires, interviews or experiments, usually takes more time and needs approval for research with people; secondary research uses existing articles, statistics or reports, is usually quicker and larger, but was collected for another purpose.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="654" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Primary vs secondary research</text><g transform="translate(0,-22)"><rect x="196.0" y="118.0" width="278.0" height="52.0" rx="12" fill="#0B1D3A"/><text x="335.0" y="151.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Primary</text><rect x="482.0" y="118.0" width="278.0" height="52.0" rx="12" fill="#C9A227"/><text x="621.0" y="151.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">Secondary</text><rect x="32.0" y="182.0" width="736.0" height="70.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="223.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Who collects</text><text x="212.0" y="223.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">You, for your own question</text><text x="498.0" y="212.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Another researcher or</text><text x="498.0" y="233.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">organisation</text><rect x="32.0" y="258.0" width="736.0" height="70.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="299.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Examples</text><text x="212.0" y="288.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Questionnaires, interviews,</text><text x="212.0" y="309.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">experiments</text><text x="498.0" y="288.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Journal articles, official statistics,</text><text x="498.0" y="309.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">annual reports</text><rect x="32.0" y="334.0" width="736.0" height="49.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="364.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Fit</text><text x="212.0" y="364.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Designed for your question</text><text x="498.0" y="364.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Adapted from another purpose</text><rect x="32.0" y="389.0" width="736.0" height="49.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="419.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Time and cost</text><text x="212.0" y="419.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Usually higher</text><text x="498.0" y="419.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Usually lower</text><rect x="32.0" y="444.0" width="736.0" height="49.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="474.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Sample</text><text x="212.0" y="474.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Often small</text><text x="498.0" y="474.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Often large</text><rect x="32.0" y="499.0" width="736.0" height="70.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="540.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Approval</text><text x="212.0" y="540.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Needed for research with people</text><text x="498.0" y="529.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Often less, but check your</text><text x="498.0" y="550.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">department</text><text x="40.0" y="601.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Many dissertations combine both: secondary sources for context and the literature review, primary data for</text><text x="40.0" y="621.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">the specific question.</text></g><text x="772.0" y="637.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>