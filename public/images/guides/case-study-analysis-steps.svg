<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 635" width="800" height="635" role="img" aria-labelledby="t d"><title id="t">Case study analysis in five steps</title><desc id="d">Five steps of a case study analysis: read the case and brief, identify key issues, apply theory, generate and evaluate options, and recommend with an implementation plan.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="634" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Case study analysis in five steps</text><g transform="translate(0,-22)"><line x1="70.0" y1="191.5" x2="70.0" y2="563.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><rect x="110.0" y="152.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="184.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Read the case and the brief carefully</text><text x="130.0" y="210.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Note the question, the marking criteria and the key facts</text><rect x="110.0" y="245.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="277.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Identify the key issues</text><text x="130.0" y="303.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Separate the underlying problems from their symptoms</text><rect x="110.0" y="338.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="370.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Apply theory and frameworks</text><text x="130.0" y="396.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Analyse the issues with the models your module teaches</text><rect x="110.0" y="431.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="463.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Generate and evaluate options</text><text x="130.0" y="489.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Compare realistic options against clear criteria</text><rect x="110.0" y="524.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="556.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Recommend and plan implementation</text><text x="130.0" y="582.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Who does what, by when, and with what resources</text><circle cx="70" cy="191.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="198.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">1</text><circle cx="70" cy="284.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="291.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">2</text><circle cx="70" cy="377.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="384.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">3</text><circle cx="70" cy="470.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="477.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">4</text><circle cx="70" cy="563.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="570.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">5</text></g><text x="772.0" y="617.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>