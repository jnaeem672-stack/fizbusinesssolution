<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 676" width="800" height="676" role="img" aria-labelledby="t d"><title id="t">How PESTLE, SWOT and TOWS fit together</title><desc id="d">Flow diagram: internal analysis feeds strengths and weaknesses; external analysis using PESTLE and Five Forces feeds opportunities and threats; the SWOT feeds a TOWS matrix of strategic options, which are evaluated to make recommendations.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="675" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">How PESTLE, SWOT and TOWS fit together</text><g transform="translate(0,-22)"><text x="453.0" y="146.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4B5563" text-anchor="middle">Helpful</text><text x="659.0" y="146.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4B5563" text-anchor="middle">Harmful</text><rect x="352.0" y="160.0" width="202.0" height="120.0" rx="12" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="368.0" y="194.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Strengths</text><text x="368.0" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Internal advantages</text><text x="368.0" y="242.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">backed by evidence</text><rect x="558.0" y="160.0" width="202.0" height="120.0" rx="12" fill="#EEF2F7" stroke="#D5DDE8" stroke-width="1"/><text x="574.0" y="194.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Weaknesses</text><text x="574.0" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Internal gaps or</text><text x="574.0" y="242.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">limitations</text><rect x="352.0" y="284.0" width="202.0" height="120.0" rx="12" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="368.0" y="318.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Opportunities</text><text x="368.0" y="346.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">External trends the</text><text x="368.0" y="366.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">organisation can use</text><rect x="558.0" y="284.0" width="202.0" height="120.0" rx="12" fill="#EEF2F7" stroke="#D5DDE8" stroke-width="1"/><text x="574.0" y="318.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Threats</text><text x="574.0" y="346.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">External pressures that</text><text x="574.0" y="366.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">could cause harm</text><rect x="40.0" y="160.0" width="250.0" height="120.0" rx="12" fill="#0B1D3A"/><text x="58.0" y="194.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Internal analysis</text><text x="58.0" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">Resources, capabilities,</text><text x="58.0" y="242.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">financial and operational</text><text x="58.0" y="262.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">evidence</text><line x1="294.0" y1="220.0" x2="344.0" y2="220.0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="40.0" y="284.0" width="250.0" height="120.0" rx="12" fill="#0B1D3A"/><text x="58.0" y="318.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">External analysis</text><text x="58.0" y="346.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">PESTLE, then industry analysis</text><text x="58.0" y="366.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">such as Porter's Five Forces</text><line x1="294.0" y1="344.0" x2="344.0" y2="344.0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" marker-end="url(#ahg)"/><line x1="556.0" y1="408.0" x2="556.0" y2="444.0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="352.0" y="450.0" width="408.0" height="92.0" rx="12" fill="#0B1D3A"/><text x="370.0" y="484.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">TOWS matrix</text><text x="370.0" y="510.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">Match internal and external factors to create SO, WO,</text><text x="370.0" y="530.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#D6DEEA" text-anchor="start">ST and WT strategic options</text><line x1="556.0" y1="546.0" x2="556.0" y2="582.0" stroke="#C9A227" stroke-width="3" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="352.0" y="588.0" width="408.0" height="60.0" rx="12" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="370.0" y="624.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Evaluate the options and recommend</text><text x="40.0" y="484.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Use the analysis on the left as</text><text x="40.0" y="505.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">evidence, so your SWOT is a</text><text x="40.0" y="526.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">conclusion, not a brainstorm.</text></g><text x="772.0" y="658.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>