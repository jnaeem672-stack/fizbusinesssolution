<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" role="img" aria-labelledby="t d"><title id="t">Anatomy of a Harvard book reference</title><desc id="d">Labelled Harvard book reference: Author, A. (2020) Title of book. 3rd edn. Publisher. Surname then initials, year in round brackets, title in italics, edition if not the first, then publisher. In-text: (Author, 2020).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="899" height="477" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Anatomy of a Harvard book reference</text><text x="40.0" y="86.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start">Cite Them Right style, used by many UK universities</text><rect x="40.0" y="140.0" width="123.4" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="55.0" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">Author, A.</text><rect x="175.4" y="140.0" width="90.7" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="190.4" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">(2020)</text><rect x="278.1" y="140.0" width="150.2" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="293.1" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start" font-style="italic">Title of book.</text><rect x="440.3" y="140.0" width="107.0" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="455.3" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">3rd edn.</text><rect x="559.4" y="140.0" width="123.4" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="574.4" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">Publisher.</text><line x1="101.7" y1="196.0" x2="101.7" y2="206.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="101.7" cy="196.0" r="3.5" fill="#C9A227"/><text x="116.4" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Surname, then initials</text><line x1="220.7" y1="196.0" x2="220.7" y2="262.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="220.7" cy="196.0" r="3.5" fill="#C9A227"/><text x="220.7" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Year in round brackets</text><line x1="353.2" y1="196.0" x2="353.2" y2="206.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="353.2" cy="196.0" r="3.5" fill="#C9A227"/><text x="353.2" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Title in italics</text><line x1="493.8" y1="196.0" x2="493.8" y2="262.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="493.8" cy="196.0" r="3.5" fill="#C9A227"/><text x="493.8" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Edition, only if not the first</text><line x1="621.0" y1="196.0" x2="621.0" y2="206.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="621.0" cy="196.0" r="3.5" fill="#C9A227"/><text x="621.0" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Publisher</text><rect x="40.0" y="346.0" width="820.0" height="82.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="62.0" y="382.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">In-text citation:</text><text x="180.3" y="382.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">(Author, 2020)</text><text x="62.0" y="408.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Quoting? Add the page:</text><text x="249.1" y="408.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">(Author, 2020, p. 14)</text><text x="872.0" y="460.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>