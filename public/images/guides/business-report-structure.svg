<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 658" width="800" height="658" role="img" aria-labelledby="t d"><title id="t">Business report structure</title><desc id="d">Business report order: title page, executive summary, contents, introduction, findings and analysis, conclusions, recommendations, references and appendices.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="657" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Business report structure</text><g transform="translate(0,-22)"><rect x="130.0" y="118.0" width="630.0" height="50.0" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="152.0" y="149.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Title page</text><text x="390.0" y="149.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Title, your name or number, module, date</text><rect x="130.0" y="176.0" width="630.0" height="50.0" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="152.0" y="207.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Executive summary</text><text x="390.0" y="207.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">One-page overview of the whole report</text><rect x="130.0" y="234.0" width="630.0" height="50.0" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="152.0" y="265.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Contents</text><text x="390.0" y="265.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Numbered headings and page numbers</text><rect x="130.0" y="292.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><rect x="130.0" y="292.0" width="6.0" height="50.0" rx="2" fill="#C9A227"/><text x="152.0" y="323.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">1. Introduction</text><text x="390.0" y="323.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Purpose, scope and structure</text><rect x="130.0" y="350.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><rect x="130.0" y="350.0" width="6.0" height="50.0" rx="2" fill="#C9A227"/><text x="152.0" y="381.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">2. Findings and analysis</text><text x="390.0" y="381.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Numbered sections applying theory and evidence</text><rect x="130.0" y="408.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><rect x="130.0" y="408.0" width="6.0" height="50.0" rx="2" fill="#C9A227"/><text x="152.0" y="439.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">3. Conclusions</text><text x="390.0" y="439.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">What the analysis shows</text><rect x="130.0" y="466.0" width="630.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><rect x="130.0" y="466.0" width="6.0" height="50.0" rx="2" fill="#C9A227"/><text x="152.0" y="497.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">4. Recommendations</text><text x="390.0" y="497.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Specific, prioritised actions</text><rect x="130.0" y="524.0" width="630.0" height="50.0" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="152.0" y="555.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">References</text><text x="390.0" y="555.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Usually Harvard in the UK</text><rect x="130.0" y="582.0" width="630.0" height="50.0" rx="10" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="152.0" y="613.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Appendices</text><text x="390.0" y="613.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Data tables, calculations, supporting material</text><path d="M110,124 H98 V278 H110" fill="none" stroke="#17325E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text transform="translate(80,201.0) rotate(-90)" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Front</text><path d="M110,298 H98 V510 H110" fill="none" stroke="#17325E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text transform="translate(80,404.0) rotate(-90)" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Main report</text><path d="M110,530 H98 V626 H110" fill="none" stroke="#17325E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text transform="translate(80,578.0) rotate(-90)" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">End</text></g><text x="772.0" y="640.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>