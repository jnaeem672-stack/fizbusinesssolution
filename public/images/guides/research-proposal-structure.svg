<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 967" width="800" height="967" role="img" aria-labelledby="t d"><title id="t">Research proposal structure</title><desc id="d">The usual order of a research proposal: title, introduction and background, research problem, aim, objectives and questions, literature review, methodology, approval and consent, timeline and references.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="966" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Research proposal structure</text><g transform="translate(0,-22)"><line x1="70.0" y1="151.5" x2="70.0" y2="895.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><rect x="110.0" y="112.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="144.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Title</text><text x="130.0" y="170.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Topic, context and population in one line</text><rect x="110.0" y="205.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="237.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Introduction and background</text><text x="130.0" y="263.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Why the topic matters now</text><rect x="110.0" y="298.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="330.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Research problem and rationale</text><text x="130.0" y="356.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">The gap your study fills, supported by evidence</text><rect x="110.0" y="391.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="423.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Aim, objectives and research questions</text><text x="130.0" y="449.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">One aim, three or four objectives and matching questions</text><rect x="110.0" y="484.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="516.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Preliminary literature review</text><text x="130.0" y="542.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Key theories and studies, ending with the gap</text><rect x="110.0" y="577.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="609.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Methodology</text><text x="130.0" y="635.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Design, sample, data collection and analysis, each justified</text><rect x="110.0" y="670.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="702.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Approval, consent and data protection</text><text x="130.0" y="728.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">How participants and their data are protected</text><rect x="110.0" y="763.0" width="650.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="795.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Timeline</text><text x="130.0" y="821.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">A realistic plan with time for supervisor feedback</text><rect x="110.0" y="856.0" width="650.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="888.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">References</text><text x="130.0" y="914.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Every source you cite, in Harvard or APA</text><circle cx="70" cy="151.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="158.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">1</text><circle cx="70" cy="244.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="251.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">2</text><circle cx="70" cy="337.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="344.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">3</text><circle cx="70" cy="430.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="437.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">4</text><circle cx="70" cy="523.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="530.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">5</text><circle cx="70" cy="616.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="623.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">6</text><circle cx="70" cy="709.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="716.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">7</text><circle cx="70" cy="802.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="809.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">8</text><circle cx="70" cy="895.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="902.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">9</text></g><text x="772.0" y="949.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>