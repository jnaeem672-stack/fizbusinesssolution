<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 894" width="800" height="894" role="img" aria-labelledby="t d"><title id="t">The decisions a methodology chapter explains</title><desc id="d">Methodology decisions in order, starting from the research question: philosophy, approach, design, sampling, data collection, data analysis, and approval and limitations, each justified against the research question.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="893" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">The decisions a methodology chapter explains</text><g transform="translate(0,-22)"><rect x="110.0" y="152.0" width="570.0" height="51.0" rx="14" fill="#0B1D3A"/><text x="130.0" y="184.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="start">Start from your research question</text><line x1="70.0" y1="177.5" x2="104.0" y2="177.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><line x1="70.0" y1="177.5" x2="70.0" y2="822.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><circle cx="70" cy="177.5" r="9" fill="#C9A227"/><rect x="110.0" y="225.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="257.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Research philosophy</text><text x="130.0" y="283.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">For example positivism, interpretivism or pragmatism</text><rect x="110.0" y="318.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="350.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Research approach</text><text x="130.0" y="376.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Deductive, inductive or abductive</text><rect x="110.0" y="411.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="443.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Research design</text><text x="130.0" y="469.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Quantitative, qualitative or mixed methods</text><rect x="110.0" y="504.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="536.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Sampling</text><text x="130.0" y="562.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Who or what you study, how many, and how they were chosen</text><rect x="110.0" y="597.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="629.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Data collection</text><text x="130.0" y="655.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Surveys, interviews, observation or secondary data</text><rect x="110.0" y="690.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="722.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Data analysis</text><text x="130.0" y="748.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Statistical tests, thematic analysis or other techniques</text><rect x="110.0" y="783.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="815.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Approval and limitations</text><text x="130.0" y="841.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Consent, data protection and the limits of your study</text><circle cx="70" cy="264.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="271.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">1</text><circle cx="70" cy="357.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="364.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">2</text><circle cx="70" cy="450.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="457.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">3</text><circle cx="70" cy="543.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="550.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">4</text><circle cx="70" cy="636.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="643.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">5</text><circle cx="70" cy="729.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="736.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">6</text><circle cx="70" cy="822.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="829.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">7</text><path d="M692,264.5 H730 V822.5 H696" fill="none" stroke="#17325E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M692,264.5 H730" fill="none" stroke="#17325E" stroke-width="2" marker-start="url(#ah)"/><text transform="translate(754,543.5) rotate(90)" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Justify each choice</text></g><text x="772.0" y="876.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>