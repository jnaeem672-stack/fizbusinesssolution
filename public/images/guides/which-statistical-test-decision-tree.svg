<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="t d"><title id="t">Which statistical test should I use?</title><desc id="d">Decision tree: to compare groups use t-tests or ANOVA (Mann-Whitney U, Wilcoxon, Kruskal-Wallis or Friedman if assumptions fail); to test relationships use Pearson, Spearman or chi-square; to predict use linear or logistic regression.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="959" height="849" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Which statistical test should I use?</text><g transform="translate(0,-22)"><rect x="250.0" y="116.0" width="460.0" height="56.0" rx="14" fill="#C9A227"/><text x="480.0" y="151.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">What does your research question ask?</text><line x1="480.0" y1="172.0" x2="480.0" y2="200.0" stroke="#17325E" stroke-width="2" stroke-linecap="round"/><line x1="173.0" y1="200.0" x2="787.0" y2="200.0" stroke="#17325E" stroke-width="2" stroke-linecap="round"/><line x1="173.0" y1="200.0" x2="173.0" y2="226.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30.0" y="230.0" width="286.0" height="50.0" rx="12" fill="#0B1D3A"/><text x="173.0" y="262.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Compare groups</text><rect x="64.0" y="302.0" width="252.0" height="94.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="78.0" y="332.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Two independent groups</text><text x="78.0" y="354.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Independent-samples t-test</text><text x="78.0" y="376.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Mann-Whitney U)</text><line x1="46.0" y1="349.0" x2="60.0" y2="349.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64.0" y="410.0" width="252.0" height="94.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="78.0" y="440.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Same people, two conditions</text><text x="78.0" y="462.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Paired-samples t-test</text><text x="78.0" y="484.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Wilcoxon signed-rank)</text><line x1="46.0" y1="457.0" x2="60.0" y2="457.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64.0" y="518.0" width="252.0" height="114.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="78.0" y="548.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Three or more independent</text><text x="78.0" y="568.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">groups</text><text x="78.0" y="590.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">One-way ANOVA</text><text x="78.0" y="612.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Kruskal-Wallis H)</text><line x1="46.0" y1="575.0" x2="60.0" y2="575.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="64.0" y="646.0" width="252.0" height="136.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="78.0" y="676.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Same people, three or more</text><text x="78.0" y="696.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">times</text><text x="78.0" y="718.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Repeated measures</text><text x="78.0" y="740.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">ANOVA</text><text x="78.0" y="762.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Friedman)</text><line x1="46.0" y1="714.0" x2="60.0" y2="714.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="46.0" y1="280.0" x2="46.0" y2="714.0" stroke="#17325E" stroke-width="2" stroke-linecap="round"/><line x1="480.0" y1="200.0" x2="480.0" y2="226.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="337.0" y="230.0" width="286.0" height="50.0" rx="12" fill="#0B1D3A"/><text x="480.0" y="262.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Test a relationship</text><rect x="371.0" y="302.0" width="252.0" height="94.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="385.0" y="332.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Two scale variables</text><text x="385.0" y="354.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Pearson correlation</text><text x="385.0" y="376.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Spearman's rho)</text><line x1="353.0" y1="349.0" x2="367.0" y2="349.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="371.0" y="410.0" width="252.0" height="74.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="385.0" y="440.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Two ordinal variables</text><text x="385.0" y="462.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Spearman's rho</text><line x1="353.0" y1="447.0" x2="367.0" y2="447.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="371.0" y="498.0" width="252.0" height="136.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="385.0" y="528.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Two categorical variables</text><text x="385.0" y="550.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Chi-square test of</text><text x="385.0" y="572.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">independence</text><text x="385.0" y="594.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">(Fisher's exact test if expected</text><text x="385.0" y="614.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#8A6700" text-anchor="start">counts are small)</text><line x1="353.0" y1="566.0" x2="367.0" y2="566.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="353.0" y1="280.0" x2="353.0" y2="566.0" stroke="#17325E" stroke-width="2" stroke-linecap="round"/><line x1="787.0" y1="200.0" x2="787.0" y2="226.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="644.0" y="230.0" width="286.0" height="50.0" rx="12" fill="#0B1D3A"/><text x="787.0" y="262.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Predict an outcome</text><rect x="678.0" y="302.0" width="252.0" height="96.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="692.0" y="332.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Scale outcome</text><text x="692.0" y="354.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Linear regression, simple or</text><text x="692.0" y="376.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">multiple</text><line x1="660.0" y1="350.0" x2="674.0" y2="350.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><rect x="678.0" y="412.0" width="252.0" height="74.0" rx="12" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="692.0" y="442.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Yes or no outcome</text><text x="692.0" y="464.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1D3A" text-anchor="start">Binary logistic regression</text><line x1="660.0" y1="449.0" x2="674.0" y2="449.0" stroke="#17325E" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/><line x1="660.0" y1="280.0" x2="660.0" y2="449.0" stroke="#17325E" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="816.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">In brackets and gold: the non-parametric alternative, for when the assumptions of the test are not met or the outcome is ordinal.</text></g><text x="932.0" y="832.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>