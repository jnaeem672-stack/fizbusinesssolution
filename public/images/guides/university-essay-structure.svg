<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 810" width="800" height="810" role="img" aria-labelledby="t d"><title id="t">University essay structure</title><desc id="d">Essay structure: introduction about 10% with context, thesis and outline; main body about 80% made of PEEL paragraphs (point, evidence, explanation, link); conclusion about 10%; then the reference list.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="809" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">University essay structure</text><g transform="translate(0,-22)"><rect x="40.0" y="116.0" width="720.0" height="104.0" rx="14" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="62.0" y="154.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Introduction</text><rect x="645.0" y="134.0" width="97.0" height="28.0" rx="14" fill="#FFFFFF" stroke="#E9DCAE" stroke-width="1"/><text x="693.5" y="153.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8A6700" text-anchor="middle">about 10%</text><text x="62.0" y="190.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Context  ·  Thesis (your answer)  ·  How the essay will develop</text><rect x="40.0" y="236.0" width="720.0" height="358.0" rx="14" fill="#EEF2F7" stroke="#D5DDE8" stroke-width="1"/><text x="62.0" y="274.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Main body</text><rect x="645.0" y="254.0" width="97.0" height="28.0" rx="14" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="1"/><text x="693.5" y="273.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8A6700" text-anchor="middle">about 80%</text><rect x="62.0" y="294.0" width="676.0" height="82.0" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="1"/><text x="80.0" y="324.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Paragraph 1: one point that supports your thesis</text><rect x="80.0" y="338.0" width="132.0" height="28.0" rx="14" fill="#0B1D3A"/><text x="146.0" y="357.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Point</text><line x1="216.0" y1="352.0" x2="236.0" y2="352.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="242.0" y="338.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="308.0" y="357.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Evidence</text><line x1="378.0" y1="352.0" x2="398.0" y2="352.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="404.0" y="338.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="470.0" y="357.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explanation</text><line x1="540.0" y1="352.0" x2="560.0" y2="352.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="566.0" y="338.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="632.0" y="357.0" font-family=