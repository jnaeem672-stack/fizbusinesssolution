 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Paragraph 3: one point that supports your thesis</text><rect x="80.0" y="530.0" width="132.0" height="28.0" rx="14" fill="#0B1D3A"/><text x="146.0" y="549.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Point</text><line x1="216.0" y1="544.0" x2="236.0" y2="544.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="242.0" y="530.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="308.0" y="549.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Evidence</text><line x1="378.0" y1="544.0" x2="398.0" y2="544.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="404.0" y="530.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="470.0" y="549.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Explanation</text><line x1="540.0" y1="544.0" x2="560.0" y2="544.0" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ahg)"/><rect x="566.0" y="530.0" width="132.0" height="28.0" rx="14" fill="#17325E"/><text x="632.0" y="549.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Link</text><rect x="40.0" y="610.0" width="720.0" height="104.0" rx="14" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="62.0" y="648.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B1D3A" text-anchor="start">Conclusion</text><rect x="645.0" y="628.0" width="97.0" height="28.0" rx="14" fill="#FFFFFF" stroke="#E9DCAE" stroke-width="1"/><text x="693.5" y="647.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8A6700" text-anchor="middle">about 10%</text><text x="62.0" y="684.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Restate your answer  ·  Show why it matters  ·  No new evidence</text><rect x="40.0" y="730.0" width="720.0" height="56.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="62.0" y="765.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Reference list: every source you cited, in Harvard, APA or your course style</text></g><text x="772.0" y="792.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>