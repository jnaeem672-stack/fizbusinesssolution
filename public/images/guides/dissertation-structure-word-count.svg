<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="800" height="660" role="img" aria-labelledby="t d"><title id="t">Dissertation structure: share of the word count</title><desc id="d">Bar chart of typical word count shares by chapter: introduction about 10%, literature review 20 to 30%, methodology 10 to 15%, findings 15 to 20%, discussion 20 to 25%, conclusion 5 to 10%.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="659" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Dissertation structure: share of the word count</text><g transform="translate(0,-22)"><rect x="40.0" y="118.0" width="18.0" height="12.0" rx="3" fill="#17325E"/><text x="64.0" y="129.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">Typical share</text><rect x="178.0" y="118.0" width="18.0" height="12.0" rx="3" fill="#9FB0CC"/><text x="202.0" y="129.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="start">Upper end of the range</text><line x1="250.0" y1="150.0" x2="250.0" y2="546.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><text x="250.0" y="570.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">0%</text><line x1="396.7" y1="150.0" x2="396.7" y2="546.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><text x="396.7" y="570.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">10%</text><line x1="543.3" y1="150.0" x2="543.3" y2="546.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><text x="543.3" y="570.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">20%</text><line x1="690.0" y1="150.0" x2="690.0" y2="546.0" stroke="#E5E7EB" stroke-width="1" stroke-linecap="round"/><text x="690.0" y="570.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">30%</text><text x="40.0" y="170.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Introduction</text><text x="40.0" y="192.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">1,000 words</text><path d="M250.0,159 H392.7 Q396.7,159 396.7,163 V177 Q396.7,181 392.7,181 H250.0 Z" fill="#17325E"/><text x="406.7" y="175.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">about 10%</text><text x="40.0" y="236.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Literature review</text><text x="40.0" y="258.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">2,000 to 3,000 words</text><path d="M250.0,225 H686.0 Q690.0,225 690.0,229 V243 Q690.0,247 686.0,247 H250.0 Z" fill="#9FB0CC"/><rect x="250.0" y="225" width="291.3" height="22" fill="#17325E"/><text x="700.0" y="241.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">20 to 30%</text><text x="40.0" y="302.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Methodology</text><text x="40.0" y="324.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">1,000 to 1,500 words</text><path d="M250.0,291 H466.0 Q470.0,291 470.0,295 V309 Q470.0,313 466.0,313 H250.0 Z" fill="#9FB0CC"/><rect x="250.0" y="291" width="144.7" height="22" fill="#17325E"/><text x="480.0" y="307.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">10 to 15%</text><text x="40.0" y="368.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Findings</text><text x="40.0" y="390.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">1,500 to 2,000 words</text><path d="M250.0,357 H539.3 Q543.3,357 543.3,361 V375 Q543.3,379 539.3,379 H250.0 Z" fill="#9FB0CC"/><rect x="250.0" y="357" width="218.0" height="22" fill="#17325E"/><text x="553.3" y="373.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">15 to 20%</text><text x="40.0" y="434.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Discussion</text><text x="40.0" y="456.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">2,000 to 2,500 words</text><path d="M250.0,423 H612.7 Q616.7,423 616.7,427 V441 Q616.7,445 612.7,445 H250.0 Z" fill="#9FB0CC"/><rect x="250.0" y="423" width="291.3" height="22" fill="#17325E"/><text x="626.7" y="439.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">20 to 25%</text><text x="40.0" y="500.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1D3A" text-anchor="start">Conclusion</text><text x="40.0" y="522.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">500 to 1,000 words</text><path d="M250.0,489 H392.7 Q396.7,489 396.7,493 V507 Q396.7,511 392.7,511 H250.0 Z" fill="#9FB0CC"/><rect x="250.0" y="489" width="71.3" height="22" fill="#17325E"/><text x="406.7" y="505.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">5 to 10%</text><text x="40.0" y="608.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">Shares for a 10,000-word dissertation. The abstract (200 to 300 words) is usually not counted. Always check your</text><text x="40.0" y="627.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">handbook.</text></g><text x="772.0" y="642.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>