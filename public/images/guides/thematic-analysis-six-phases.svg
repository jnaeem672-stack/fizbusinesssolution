<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 728" width="800" height="728" role="img" aria-labelledby="t d"><title id="t">Thematic analysis: the six phases</title><desc id="d">Six phases of thematic analysis in order: familiarise, generate initial codes, search for themes, review themes, define and name themes, produce the report. Researchers move back and forth between phases.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="727" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Thematic analysis: the six phases</text><text x="40.0" y="86.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start">Braun and Clarke (2006). The phases are a guide, not a rigid checklist.</text><line x1="70.0" y1="169.5" x2="70.0" y2="634.5" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><rect x="110.0" y="130.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="162.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Familiarise yourself with the data</text><text x="130.0" y="188.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Read and re-read transcripts and note first ideas</text><rect x="110.0" y="223.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="255.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Generate initial codes</text><text x="130.0" y="281.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Label interesting features across the whole dataset</text><rect x="110.0" y="316.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="348.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Search for (generate) themes</text><text x="130.0" y="374.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Group related codes into candidate themes</text><rect x="110.0" y="409.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="441.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Review themes</text><text x="130.0" y="467.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Check them against the coded extracts and the full dataset</text><rect x="110.0" y="502.0" width="570.0" height="79.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="534.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Define and name themes</text><text x="130.0" y="560.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Say clearly what each theme is about and give it a name</text><rect x="110.0" y="595.0" width="570.0" height="79.0" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/><text x="130.0" y="627.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="start">Produce the report</text><text x="130.0" y="653.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Write up with vivid extracts linked to your research question</text><circle cx="70" cy="169.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="176.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">1</text><circle cx="70" cy="262.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="269.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">2</text><circle cx="70" cy="355.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="362.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">3</text><circle cx="70" cy="448.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="455.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">4</text><circle cx="70" cy="541.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="548.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">5</text><circle cx="70" cy="634.5" r="21" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="70.0" y="641.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">6</text><path d="M692,169.5 H730 V634.5 H696" fill="none" stroke="#17325E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M692,169.5 H730" fill="none" stroke="#17325E" stroke-width="2" marker-start="url(#ah)"/><text transform="translate(754,402.0) rotate(90)" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Move back and forth</text><text x="772.0" y="710.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>