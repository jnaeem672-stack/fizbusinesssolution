<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 834" width="900" height="834" role="img" aria-labelledby="t d"><title id="t">Anatomy of an APA 7 journal reference</title><desc id="d">Labelled APA 7 journal reference: Braun, V., &amp; Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77-101, followed by the DOI link.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="899" height="833" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Anatomy of an APA 7 journal reference</text><text x="40.0" y="86.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="17" font-weight="400" fill="#4B5563" text-anchor="start">Real example: Braun and Clarke (2006)</text><rect x="40.0" y="140.0" width="241.3" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="55.0" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">Braun, V., &amp; Clarke, V.</text><rect x="293.3" y="140.0" width="96.5" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="308.3" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">(2006).</text><rect x="401.8" y="140.0" width="389.5" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="416.8" y="174.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">Using thematic analysis in psychology.</text><line x1="160.6" y1="196.0" x2="160.6" y2="206.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="160.6" cy="196.0" r="3.5" fill="#C9A227"/><text x="160.6" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Surname, initials, &amp; before</text><text x="160.6" y="241.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">the last author</text><line x1="341.5" y1="196.0" x2="341.5" y2="262.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="341.5" cy="196.0" r="3.5" fill="#C9A227"/><text x="341.5" y="278.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Year in brackets, then a</text><text x="341.5" y="297.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">full stop</text><line x1="596.5" y1="196.0" x2="596.5" y2="206.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="596.5" cy="196.0" r="3.5" fill="#C9A227"/><text x="596.5" y="222.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Article title in sentence</text><text x="596.5" y="241.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">case</text><rect x="40.0" y="346.0" width="366.1" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="55.0" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start" font-style="italic">Qualitative Research in Psychology,</text><rect x="418.1" y="346.0" width="73.2" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="433.1" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" fill="#0B1D3A"><tspan font-style="italic">3</tspan>(2),</text><rect x="503.3" y="346.0" width="101.2" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="518.3" y="380.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">77-101.</text><line x1="223.1" y1="402.0" x2="223.1" y2="412.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="223.1" cy="402.0" r="3.5" fill="#C9A227"/><text x="223.1" y="428.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Journal name in title case</text><text x="223.1" y="447.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">and italics</text><line x1="454.7" y1="402.0" x2="454.7" y2="468.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="454.7" cy="402.0" r="3.5" fill="#C9A227"/><text x="454.7" y="484.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Volume in italics, issue in</text><text x="454.7" y="503.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">brackets</text><line x1="553.9" y1="402.0" x2="553.9" y2="412.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="553.9" cy="402.0" r="3.5" fill="#C9A227"/><text x="553.9" y="428.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">Page range</text><rect x="40.0" y="552.0" width="443.3" height="52.0" rx="10" fill="#FBF6E6" stroke="#E9DCAE" stroke-width="1"/><text x="55.0" y="586.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B1D3A" text-anchor="start">https://doi.org/10.1191/1478088706qp063oa</text><line x1="261.7" y1="608.0" x2="261.7" y2="618.0" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="261.7" cy="608.0" r="3.5" fill="#C9A227"/><text x="261.7" y="634.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#17325E" text-anchor="middle">DOI as a full link</text><rect x="40.0" y="702.0" width="820.0" height="82.0" rx="14" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/><text x="62.0" y="738.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Parenthetical:</text><text x="173.7" y="738.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">(Braun &amp; Clarke, 2006)</text><text x="62.0" y="764.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Narrative:</text><text x="143.5" y="764.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4B5563" text-anchor="start">Braun and Clarke (2006)</text><text x="872.0" y="816.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>