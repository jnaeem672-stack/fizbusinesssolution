<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 676" width="800" height="676" role="img" aria-labelledby="t d"><title id="t">Quantitative vs qualitative research</title><desc id="d">Comparison table: quantitative research asks how much or to what extent, uses numbers, larger samples, surveys and statistics, and gives generalisable patterns; qualitative research asks how and why, uses words, smaller purposive samples, interviews and thematic coding, and gives deep understanding of a context.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17325E"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A227"/></marker></defs><rect x="0.5" y="0.5" width="799" height="675" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40.0" y="54.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1D3A" text-anchor="start">Quantitative vs qualitative research</text><g transform="translate(0,-22)"><rect x="196.0" y="118.0" width="278.0" height="52.0" rx="12" fill="#0B1D3A"/><text x="335.0" y="151.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Quantitative</text><rect x="482.0" y="118.0" width="278.0" height="52.0" rx="12" fill="#C9A227"/><text x="621.0" y="151.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0B1D3A" text-anchor="middle">Qualitative</text><rect x="32.0" y="182.0" width="736.0" height="70.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="223.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Asks</text><text x="212.0" y="212.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">How much? How many? To what</text><text x="212.0" y="233.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">extent?</text><text x="498.0" y="223.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">How? Why? What is it like?</text><rect x="32.0" y="258.0" width="736.0" height="49.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="288.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Data</text><text x="212.0" y="288.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Numbers</text><text x="498.0" y="288.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Words, images and observations</text><rect x="32.0" y="313.0" width="736.0" height="49.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="343.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Sample</text><text x="212.0" y="343.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Larger, often random</text><text x="498.0" y="343.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Smaller, chosen on purpose</text><rect x="32.0" y="368.0" width="736.0" height="70.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="409.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Methods</text><text x="212.0" y="398.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Surveys, experiments, existing</text><text x="212.0" y="419.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">datasets</text><text x="498.0" y="398.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Interviews, focus groups,</text><text x="498.0" y="419.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">observation</text><rect x="32.0" y="444.0" width="736.0" height="70.0" rx="10" fill="#F5F7FA"/><text x="44.0" y="485.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Analysis</text><text x="212.0" y="485.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Statistics, for example in SPSS</text><text x="498.0" y="474.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Coding and themes, for example</text><text x="498.0" y="495.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">in NVivo</text><rect x="32.0" y="520.0" width="736.0" height="70.0" rx="10" fill="#FFFFFF"/><text x="44.0" y="561.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1D3A" text-anchor="start">Result</text><text x="212.0" y="561.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Patterns you can generalise</text><text x="498.0" y="550.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">Deep understanding of one</text><text x="498.0" y="571.5" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0B1D3A" text-anchor="start">context</text><text x="40.0" y="622.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">Neither is better. Choose the approach that fits your research question, the data you can get and your</text><text x="40.0" y="642.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">subject.</text></g><text x="772.0" y="658.0" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9CA3AF" text-anchor="end">fizbusinessolutions.com</text></svg>